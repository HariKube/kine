            | Metric | HariKube AE | Vanilla K8s | Gain |
            | - | - | - | - |
            | Throughput | 119 req/s ✅ | 25 req/s ❌ | 4.8x |
            | Success Rate | 100% ✅ | 100% (then OOM) ❌ | not comparable |
